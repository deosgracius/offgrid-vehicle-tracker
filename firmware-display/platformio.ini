; Group 9 display-node firmware — Waveshare ESP32-S3-RLCD-4.2
;
;   pio run -e display              build (SIM_MODE: fake data, no radios)
;   pio run -e display-ble          build (real BLE link to the Heltec)
;   pio run -e display-ble -t upload
;   pio test -e native              nav-math unit tests on your laptop
;
; src/generated/ holds nanopb C sources pre-generated from meshtastic/protobufs
; (generator nanopb 0.4.9.1 — regenerate only when bumping the Nanopb lib too).

[base]
; pioarduino platform (Arduino core 3.x / IDF 5.x). The official espressif32
; platform's core 2.x boot-loops this board's chip revision - verified 2026-08-30.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.20/platform-espressif32.zip
framework = arduino
board = esp32-s3-devkitc-1
; Waveshare ESP32-S3-RLCD-4.2: 16 MB flash, 8 MB octal PSRAM
board_build.flash_size = 16MB
; Per Waveshare's ESP-IDF sdkconfig: flash DIO @ 80MHz, PSRAM octal (SPIRAM_MODE_OCT).
; QIO flash mode silently boot-loops this board's flash chip - do not "fix" back to qio.
board_build.arduino.memory_type = dio_opi
board_build.flash_mode = dio
board_build.partitions = default_16MB.csv
build_flags =
    -DBOARD_HAS_PSRAM
    ; route Serial to the board's native USB port (USB-Serial/JTAG)
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=3
    -std=gnu++17
    -I src/generated
build_unflags = -std=gnu++11
monitor_speed = 115200
lib_deps =
    h2zero/NimBLE-Arduino@^2.2.0
    nanopb/Nanopb@^0.4.91

[env:display]
extends = base
build_flags = ${base.build_flags} -DSIM_MODE=1

[env:display-ble]
extends = base
build_flags = ${base.build_flags} -DSIM_MODE=0

[env:native]
platform = native
build_flags = -std=c++17
build_src_filter = +<nav/>
test_build_src = yes
