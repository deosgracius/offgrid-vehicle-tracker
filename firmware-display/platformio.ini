; Group 9 display-node firmware — Waveshare ESP32-S3-RLCD-4.2
;
;   pio run -e display          build firmware
;   pio run -e display -t upload
;   pio test -e native          run nav-math unit tests on your laptop (no hardware)
;
; SIM_MODE=1 feeds the UI from the simulator instead of BLE (Josiah's default).
; Set -DSIM_MODE=0 once the BLE link is live (Deo).

[env:display]
platform = espressif32
framework = arduino
board = esp32-s3-devkitc-1
; Waveshare ESP32-S3-RLCD-4.2: 16 MB flash, 8 MB octal PSRAM
board_build.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_16MB.csv
build_flags =
    -DBOARD_HAS_PSRAM
    -DSIM_MODE=1
    -std=gnu++17
build_unflags = -std=gnu++11
monitor_speed = 115200
lib_deps =
    h2zero/NimBLE-Arduino@^1.4.2

[env:native]
platform = native
build_flags = -std=c++17
build_src_filter = +<nav/>
test_build_src = yes
